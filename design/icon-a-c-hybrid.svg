<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Capture for Tolaria A style C shape hybrid</title>
  <desc id="desc">A comparison of the A visual style, the original C color treatment, and the proposed hybrid with an orange frame and purple dot.</desc>

  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#243247" flood-opacity="0.10" />
    </filter>

    <symbol id="icon-a-reference" viewBox="0 0 256 256">
      <rect x="16" y="16" width="224" height="224" rx="64" fill="#1E293B" />
      <path d="M149 62h-28c-36 0-65 29-65 66s29 66 65 66h28" fill="none" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round" />
      <path d="M164 74v25" fill="none" stroke="#D97706" stroke-width="18" stroke-linecap="round" />
      <circle cx="164" cy="181" r="10" fill="#D97706" />
    </symbol>

    <symbol id="icon-c-original" viewBox="0 0 256 256">
      <rect x="16" y="16" width="224" height="224" rx="64" fill="#293B52" />
      <path d="M149 62h-24c-32 0-58 26-58 66s26 66 58 66h24" fill="none" stroke="#F8FAFC" stroke-width="16" stroke-linecap="round" />
      <path d="M161 75h29v106h-29" fill="none" stroke="#A79BF4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="190" cy="128" r="11" fill="#D97706" />
    </symbol>

    <symbol id="icon-hybrid" viewBox="0 0 256 256">
      <rect x="16" y="16" width="224" height="224" rx="64" fill="#1E293B" />
      <path d="M149 62h-24c-32 0-58 26-58 66s26 66 58 66h24" fill="none" stroke="#F8FAFC" stroke-width="16" stroke-linecap="round" />
      <path d="M161 75h29v106h-29" fill="none" stroke="#D97706" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="190" cy="128" r="11" fill="#A79BF4" />
    </symbol>
  </defs>

  <rect width="1440" height="860" fill="#F4F7FB" />

  <text x="80" y="72" fill="#0F172A" font-family="Segoe UI, system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.8">A × C icon hybrid</text>
  <text x="80" y="108" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="500">A 的视觉风格 + C 的形体结构 · 折框橙色 / 圆点紫色</text>
  <path d="M80 136h1280" stroke="#D8E1EC" stroke-width="2" />

  <g filter="url(#card-shadow)">
    <rect x="80" y="176" width="400" height="430" rx="24" fill="#FFFFFF" />
    <rect x="520" y="176" width="400" height="430" rx="24" fill="#FFFFFF" />
    <rect x="960" y="176" width="400" height="430" rx="24" fill="#FFFFFF" />
  </g>

  <!-- A style reference -->
  <g>
    <circle cx="122" cy="220" r="22" fill="#E8EEF6" />
    <text x="122" y="228" text-anchor="middle" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">A</text>
    <text x="160" y="218" fill="#0F172A" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700">A Style</text>
    <text x="160" y="244" fill="#D97706" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">REFERENCE</text>
    <use href="#icon-a-reference" x="196" y="272" width="168" height="168" />
    <text x="112" y="484" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">扁平、深色底、高对比</text>
    <text x="112" y="514" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="14">作为混合方案的视觉基准。</text>
    <rect x="112" y="548" width="108" height="28" rx="14" fill="#EEF2F7" />
    <text x="166" y="567" text-anchor="middle" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">flat / clear</text>
  </g>

  <!-- Original C for comparison -->
  <g>
    <circle cx="562" cy="220" r="22" fill="#EAE9FA" />
    <text x="562" y="228" text-anchor="middle" fill="#5C54A6" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">C</text>
    <text x="600" y="218" fill="#0F172A" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700">C Original</text>
    <text x="600" y="244" fill="#665DD0" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">COLOR REFERENCE</text>
    <use href="#icon-c-original" x="636" y="272" width="168" height="168" />
    <text x="552" y="484" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">紫色折框 + 橙色圆点</text>
    <text x="552" y="514" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="14">保留 C 版原始配色，作为对照。</text>
    <rect x="552" y="548" width="124" height="28" rx="14" fill="#EEEDFC" />
    <text x="614" y="567" text-anchor="middle" fill="#5C54A6" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">purple frame</text>
  </g>

  <!-- Proposed hybrid -->
  <g>
    <circle cx="1002" cy="220" r="22" fill="#F4E9D7" />
    <text x="1002" y="228" text-anchor="middle" fill="#A45F0C" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">A×C</text>
    <text x="1040" y="218" fill="#0F172A" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700">Hybrid</text>
    <text x="1040" y="244" fill="#A45F0C" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PROPOSED</text>
    <use href="#icon-hybrid" x="1076" y="272" width="168" height="168" />
    <text x="992" y="484" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">橙色折框 + 紫色圆点</text>
    <text x="992" y="514" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="14">C 的结构更有系统感，A 的底色更稳。</text>
    <rect x="992" y="548" width="126" height="28" rx="14" fill="#F4F0EA" />
    <text x="1055" y="567" text-anchor="middle" fill="#A45F0C" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">orange frame</text>
  </g>

  <!-- Toolbar-scale preview -->
  <g>
    <text x="80" y="670" fill="#0F172A" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">Toolbar scale check</text>
    <text x="80" y="696" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="14">重点观察右侧折框与圆点在 16px 下是否仍然清晰。</text>
    <rect x="80" y="718" width="1280" height="82" rx="20" fill="#DCE5F0" />
    <rect x="104" y="736" width="1232" height="46" rx="12" fill="#4A5565" />
    <circle cx="134" cy="759" r="8" fill="#94A3B8" />
    <path d="M166 759h62" stroke="#77859A" stroke-width="4" stroke-linecap="round" />
    <use href="#icon-a-reference" x="930" y="743" width="32" height="32" />
    <use href="#icon-c-original" x="978" y="743" width="32" height="32" />
    <use href="#icon-hybrid" x="1026" y="743" width="32" height="32" />
    <text x="946" y="774" text-anchor="middle" fill="#475569" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">A</text>
    <text x="994" y="774" text-anchor="middle" fill="#475569" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">C</text>
    <text x="1042" y="774" text-anchor="middle" fill="#475569" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">A×C</text>
    <text x="1288" y="764" text-anchor="end" fill="#C8D2E0" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">16px / flat / high contrast</text>
  </g>
</svg>
