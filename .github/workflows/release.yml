name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm.cmd install --frozen-lockfile

      - name: Resolve release version
        id: release_version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run release gate
        run: pnpm.cmd run check

      - name: Run Golden tests
        run: pnpm.cmd run test:golden

      - name: Build single-file Helper
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/build-helper.ps1

      - name: Assemble Release Package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/assemble-release.ps1 -ReleaseTag $env:GITHUB_REF_NAME

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.7.1 -Force

      - name: Run Windows release acceptance
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path installer/windows/tests -PassThru
          if ($result.FailedCount -ne 0) { exit 1 }

      - name: Validate release contents
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }
          if ($version -notmatch '^(?<chromeVersion>\d+\.\d+\.\d+)-(?<channel>alpha|beta)\.(?<releaseNumber>\d+)$') {
            throw "VERSION is not a supported pre-release version: $version"
          }
          $chromeVersion = $Matches.chromeVersion
          $channelName = if ($Matches.channel -eq "alpha") { "Alpha" } else { "Beta" }
          $releaseNumber = $Matches.releaseNumber
          $expectedVersionName = "$chromeVersion $channelName $releaseNumber"
          $helperPath = "release\capture-for-tolaria-helper-$version-windows-x64.exe"
          if (-not (Test-Path $helperPath)) {
            throw "Release Helper is missing: $helperPath"
          }
          $hostTemplate = Get-Content installer\windows\native-host-manifest.json.in -Raw | ConvertFrom-Json
          if (@($hostTemplate.allowed_origins) -notcontains "chrome-extension://ncjeeembmcgkfjipkfhganbdnadbhdcl/") {
            throw "Native Host allowed_origins does not contain the fixed Extension ID"
          }
          $extensionZip = "release\capture-for-tolaria-extension-$env:GITHUB_REF_NAME.zip"
          $extensionUnpack = Join-Path $env:TEMP "capture-for-tolaria-extension-release-check-$PID"
          $installerZip = "release\capture-for-tolaria-installer-$env:GITHUB_REF_NAME.zip"
          $unpack = Join-Path $env:TEMP "capture-for-tolaria-release-check-$PID"
          try {
            Expand-Archive -LiteralPath $extensionZip -DestinationPath $extensionUnpack -Force
            $extensionManifest = Get-Content (Join-Path $extensionUnpack "manifest.json") -Raw | ConvertFrom-Json
            $permissions = @($extensionManifest.permissions | Sort-Object) -join ","
            if ($permissions -ne "activeTab,nativeMessaging,scripting,storage" -or $null -ne $extensionManifest.host_permissions -or $extensionManifest.options_page -ne "options.html") {
              throw "Extension manifest permissions are outside the V0.1 contract"
            }
            if ($extensionManifest.version -ne $chromeVersion -or $extensionManifest.version_name -ne $expectedVersionName) {
              throw "Extension manifest version contract is invalid"
            }

            Expand-Archive -LiteralPath $installerZip -DestinationPath $unpack -Force
            $requiredFiles = @(
              "capture-for-tolaria-helper-$version-windows-x64.exe",
              "VERSION",
              "extension\manifest.json",
              "extension\background.js",
              "extension\options.html",
              "extension\popup.html",
              "installer\windows\install.ps1",
              "installer\windows\repair.ps1",
              "installer\windows\configure-vault.ps1",
              "installer\windows\uninstall.ps1",
              "installer\windows\native-host-manifest.json.in",
              "installer\windows\install-extension.md",
              "INSTALL-WINDOWS.md"
            )
            foreach ($requiredFile in $requiredFiles) {
              if (-not (Test-Path (Join-Path $unpack $requiredFile))) {
                throw "Installer archive is missing $requiredFile"
              }
            }
            $forbiddenInstallerFiles = @(
              "installer\windows\assemble-release.ps1",
              "installer\windows\build-helper.ps1",
              "installer\windows\generate-checksums.ps1",
              "installer\windows\generate-sbom.ps1",
              "installer\windows\helper-sea-config.json"
            )
            foreach ($forbiddenInstallerFile in $forbiddenInstallerFiles) {
              if (Test-Path (Join-Path $unpack $forbiddenInstallerFile)) {
                throw "Installer archive contains a development file: $forbiddenInstallerFile"
              }
            }
          }
          finally {
            Remove-Item $extensionUnpack -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $unpack -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Generate checksums and SBOM
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/generate-sbom.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/generate-checksums.ps1

      - name: Upload installer package artifact
        uses: actions/upload-artifact@v4
        with:
          name: capture-for-tolaria-installer-${{ github.ref_name }}
          path: release/capture-for-tolaria-installer-${{ github.ref_name }}.zip

  macos-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
      APPLE_NOTARY_KEYCHAIN_PROFILE: capture-for-tolaria-notary
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: |
          actual="$(uname -m)"
          case "$actual" in
            arm64) actual_label="arm64" ;;
            x86_64) actual_label="x64" ;;
            *) echo "Unsupported runner architecture: $actual" >&2; exit 1 ;;
          esac
          if [ "$actual_label" != "${{ matrix.arch }}" ]; then
            echo "Runner label resolved to $actual_label, expected ${{ matrix.arch }}" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: release_version
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run release gate
        run: pnpm run check

      - name: Run Golden tests
        run: pnpm run test:golden

      - name: Build single-file macOS Helper
        run: |
          mkdir -p "$RUNNER_TEMP/capture-for-tolaria-release"
          bash installer/macos/build-helper.sh \
            --arch "${{ matrix.arch }}" \
            --output-dir "$RUNNER_TEMP/capture-for-tolaria-release"

      - name: Run macOS Installer lifecycle tests
        run: |
          helper_path="$RUNNER_TEMP/capture-for-tolaria-release/capture-for-tolaria-helper-$(tr -d '\r\n' < VERSION)-macos-${{ matrix.arch }}"
          CAPTURE_FOR_TOLARIA_MACOS_TEST_HELPER="$helper_path" bash installer/macos/tests/run-tests.sh

      - name: Configure notarization credentials
        run: |
          test -n "$APPLE_DEVELOPER_ID_APPLICATION" || { echo "APPLE_DEVELOPER_ID_APPLICATION secret is missing" >&2; exit 1; }
          test -n "$APPLE_NOTARY_KEY_ID" || { echo "APPLE_NOTARY_KEY_ID secret is missing" >&2; exit 1; }
          test -n "$APPLE_NOTARY_ISSUER_ID" || { echo "APPLE_NOTARY_ISSUER_ID secret is missing" >&2; exit 1; }
          test -n "$APPLE_NOTARY_PRIVATE_KEY" || { echo "APPLE_NOTARY_PRIVATE_KEY secret is missing" >&2; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_NOTARY_KEY_ID.p8"
          umask 077
          printf '%s\n' "$APPLE_NOTARY_PRIVATE_KEY" > "$key_path"
          xcrun notarytool store-credentials "$APPLE_NOTARY_KEYCHAIN_PROFILE" \
            --key "$key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"
          rm -f "$key_path"

      - name: Sign macOS Helper
        run: |
          helper_path="$RUNNER_TEMP/capture-for-tolaria-release/capture-for-tolaria-helper-${{ steps.release_version.outputs.version }}-macos-${{ matrix.arch }}"
          bash installer/macos/sign-and-notarize.sh \
            --helper "$helper_path" \
            --identity "$APPLE_DEVELOPER_ID_APPLICATION"

      - name: Assemble macOS Installer DMG
        run: |
          version="${{ steps.release_version.outputs.version }}"
          helper_path="$RUNNER_TEMP/capture-for-tolaria-release/capture-for-tolaria-helper-$version-macos-${{ matrix.arch }}"
          bash installer/macos/assemble-release.sh \
            --arch "${{ matrix.arch }}" \
            --output-dir "$RUNNER_TEMP/capture-for-tolaria-release" \
            --helper-path "$helper_path"

      - name: Check macOS Installer DMG contents
        run: |
          version="${{ steps.release_version.outputs.version }}"
          dmg_path="$RUNNER_TEMP/capture-for-tolaria-release/capture-for-tolaria-installer-v$version-macos-${{ matrix.arch }}.dmg"
          bash installer/macos/tests/check-dmg.sh \
            --arch "${{ matrix.arch }}" \
            --version "$version" \
            --dmg "$dmg_path"

      - name: Notarize and staple macOS Installer DMG
        run: |
          version="${{ steps.release_version.outputs.version }}"
          dmg_path="$RUNNER_TEMP/capture-for-tolaria-release/capture-for-tolaria-installer-v$version-macos-${{ matrix.arch }}.dmg"
          bash installer/macos/sign-and-notarize.sh \
            --dmg "$dmg_path" \
            --keychain-profile "$APPLE_NOTARY_KEYCHAIN_PROFILE"

      - name: Recheck notarized macOS Installer DMG
        run: |
          version="${{ steps.release_version.outputs.version }}"
          dmg_path="$RUNNER_TEMP/capture-for-tolaria-release/capture-for-tolaria-installer-v$version-macos-${{ matrix.arch }}.dmg"
          bash installer/macos/tests/check-dmg.sh \
            --arch "${{ matrix.arch }}" \
            --version "$version" \
            --dmg "$dmg_path"

      - name: Upload macOS installer package artifact
        uses: actions/upload-artifact@v4
        with:
          name: capture-for-tolaria-installer-${{ github.ref_name }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/capture-for-tolaria-release/capture-for-tolaria-installer-v${{ steps.release_version.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish-release:
    needs:
      - windows-release
      - macos-release
    runs-on: ubuntu-latest
    steps:
      - name: Download release package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: capture-for-tolaria-installer-${{ github.ref_name }}*
          path: release
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected_assets=(
            "capture-for-tolaria-installer-$GITHUB_REF_NAME.zip"
            "capture-for-tolaria-installer-v$version-macos-arm64.dmg"
            "capture-for-tolaria-installer-v$version-macos-x64.dmg"
          )
          for asset in "${expected_assets[@]}"; do
            test -f "release/$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          actual_count="$(find release -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$actual_count" -eq "${#expected_assets[@]}" || {
            echo "Unexpected number of release assets: $actual_count" >&2
            find release -mindepth 1 -maxdepth 1 -type f -print >&2
            exit 1
          }
          test -z "$(find release -mindepth 1 -maxdepth 1 ! -type f -print -quit)" || {
            echo "Release staging contains an unexpected directory" >&2
            exit 1
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/capture-for-tolaria-installer-${{ github.ref_name }}.zip
            release/capture-for-tolaria-installer-${{ github.ref_name }}-macos-arm64.dmg
            release/capture-for-tolaria-installer-${{ github.ref_name }}-macos-x64.dmg
          generate_release_notes: true
          prerelease: true
