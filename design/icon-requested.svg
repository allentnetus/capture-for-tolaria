<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768" role="img" aria-labelledby="title desc">
  <title id="title">Capture for Tolaria requested icon style</title>
  <desc id="desc">A dark slate Capture for Tolaria icon with a white half C nesting an orange folded frame and a purple dot.</desc>

  <defs>
    <symbol id="requested-icon" viewBox="0 0 384 384">
      <rect width="384" height="384" rx="104" fill="#1E293B" />

      <!-- The folded frame sits behind and inside the open C. -->
      <path d="M244 96h24c9 0 16 7 16 16v160c0 9-7 16-16 16h-24" fill="none" stroke="#D97706" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M246 68h-50c-57 0-103 46-103 124s46 124 103 124h50" fill="none" stroke="#F8FAFC" stroke-width="22" stroke-linecap="round" />
      <circle cx="288" cy="192" r="15" fill="#A79BF4" />
    </symbol>
  </defs>

  <rect width="768" height="768" rx="48" fill="#F4F7FB" />
  <use href="#requested-icon" x="192" y="120" width="384" height="384" />
  <use href="#requested-icon" x="610" y="650" width="70" height="70" />
</svg>
