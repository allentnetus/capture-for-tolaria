name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm.cmd install --frozen-lockfile

      - name: Lint
        run: pnpm.cmd run lint

      - name: Build workspace
        run: pnpm.cmd run build

      - name: Typecheck
        run: pnpm.cmd run typecheck

      - name: Unit and integration tests
        run: pnpm.cmd run test

      - name: Golden tests
        run: pnpm.cmd run test:golden

      - name: Build single-file Helper
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/build-helper.ps1

      - name: Assemble current release bundle
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/assemble-release.ps1 -ReleaseTag "v$version"

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.7.1 -Force

      - name: Run installer tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path installer/windows/tests -PassThru
          if ($result.FailedCount -ne 0) { exit 1 }

  macos-quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: |
          actual="$(uname -m)"
          case "$actual" in
            arm64) actual_label="arm64" ;;
            x86_64) actual_label="x64" ;;
            *) echo "Unsupported runner architecture: $actual" >&2; exit 1 ;;
          esac
          if [ "$actual_label" != "${{ matrix.arch }}" ]; then
            echo "Runner label resolved to $actual_label, expected ${{ matrix.arch }}" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build workspace
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm run test

      - name: Golden tests
        run: pnpm run test:golden

      - name: Build single-file macOS Helper
        run: |
          mkdir -p "$RUNNER_TEMP/capture-for-tolaria-release"
          bash installer/macos/build-helper.sh \
            --arch "${{ matrix.arch }}" \
            --output-dir "$RUNNER_TEMP/capture-for-tolaria-release"

      - name: Run macOS Installer lifecycle tests
        run: |
          helper_path="$RUNNER_TEMP/capture-for-tolaria-release/capture-for-tolaria-helper-$(tr -d '\r\n' < VERSION)-macos-${{ matrix.arch }}"
          CAPTURE_FOR_TOLARIA_MACOS_TEST_HELPER="$helper_path" bash installer/macos/tests/run-tests.sh

      - name: Assemble macOS Installer DMG
        run: |
          bash installer/macos/assemble-release.sh \
            --arch "${{ matrix.arch }}" \
            --output-dir "$RUNNER_TEMP/capture-for-tolaria-release" \
            --helper-path "$RUNNER_TEMP/capture-for-tolaria-release/capture-for-tolaria-helper-$(tr -d '\r\n' < VERSION)-macos-${{ matrix.arch }}"

      - name: Check macOS Installer DMG contents
        run: |
          bash installer/macos/tests/check-dmg.sh \
            --arch "${{ matrix.arch }}" \
            --version "$(tr -d '\r\n' < VERSION)" \
            --dmg "$RUNNER_TEMP/capture-for-tolaria-release/capture-for-tolaria-installer-v$(tr -d '\r\n' < VERSION)-macos-${{ matrix.arch }}.dmg"
