name: 功能建议
description: 提议产品或工程改进
title: "[功能] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述用户场景和当前限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我确认该提议不会绕过当前的权限、Vault 安全和隐私边界。
          required: true
