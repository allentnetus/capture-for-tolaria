<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Capture for Tolaria icon direction study</title>
  <desc id="desc">Three icon directions for Capture for Tolaria: a capture frame, an editorial page, and a knowledge vault.</desc>

  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#243247" flood-opacity="0.10" />
    </filter>

    <symbol id="icon-a" viewBox="0 0 256 256">
      <rect x="16" y="16" width="224" height="224" rx="64" fill="#1E293B" />
      <path d="M149 62h-28c-36 0-65 29-65 66s29 66 65 66h28" fill="none" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round" />
      <path d="M164 74v25" fill="none" stroke="#D97706" stroke-width="18" stroke-linecap="round" />
      <circle cx="164" cy="181" r="10" fill="#D97706" />
    </symbol>

    <symbol id="icon-b" viewBox="0 0 256 256">
      <rect x="16" y="16" width="224" height="224" rx="64" fill="#F1EEE8" />
      <path d="M70 52h80l36 36v116H70z" fill="#1E293B" />
      <path d="M150 52v36h36" fill="#F8FAFC" />
      <path d="M94 116h53M94 138h44" fill="none" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round" opacity="0.82" />
      <path d="M160 145h28v48l-14-10-14 10z" fill="#D97706" />
    </symbol>

    <symbol id="icon-c" viewBox="0 0 256 256">
      <rect x="16" y="16" width="224" height="224" rx="64" fill="#293B52" />
      <path d="M149 62h-24c-32 0-58 26-58 66s26 66 58 66h24" fill="none" stroke="#F8FAFC" stroke-width="16" stroke-linecap="round" />
      <path d="M161 75h29v106h-29" fill="none" stroke="#A79BF4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="190" cy="128" r="11" fill="#D97706" />
    </symbol>
  </defs>

  <rect width="1440" height="900" fill="#F4F7FB" />

  <text x="80" y="72" fill="#0F172A" font-family="Segoe UI, system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.8">Capture for Tolaria</text>
  <text x="80" y="108" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="500">Icon direction study · three visual routes · not yet wired into the extension</text>
  <path d="M80 136h1280" stroke="#D8E1EC" stroke-width="2" />

  <g filter="url(#card-shadow)">
    <rect x="80" y="176" width="400" height="468" rx="24" fill="#FFFFFF" />
    <rect x="520" y="176" width="400" height="468" rx="24" fill="#FFFFFF" />
    <rect x="960" y="176" width="400" height="468" rx="24" fill="#FFFFFF" />
  </g>

  <!-- Direction A -->
  <g>
    <circle cx="122" cy="220" r="22" fill="#E8EEF6" />
    <text x="122" y="228" text-anchor="middle" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">A</text>
    <text x="160" y="218" fill="#0F172A" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700">Capture Frame</text>
    <text x="160" y="244" fill="#D97706" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">RECOMMENDED</text>
    <use href="#icon-a" x="196" y="278" width="168" height="168" />
    <text x="112" y="488" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">Open C = page capture frame</text>
    <text x="112" y="516" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="14">保持现有 C 的识别度，加入捕获入口语义。</text>
    <text x="112" y="552" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Capture · Article · Local knowledge</text>
    <rect x="112" y="576" width="122" height="28" rx="14" fill="#EEF2F7" />
    <text x="173" y="595" text-anchor="middle" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">brand continuity</text>
  </g>

  <!-- Direction B -->
  <g>
    <circle cx="562" cy="220" r="22" fill="#F1EEE8" />
    <text x="562" y="228" text-anchor="middle" fill="#6B5E4C" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">B</text>
    <text x="600" y="218" fill="#0F172A" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700">Editorial Page</text>
    <text x="600" y="244" fill="#6B5E4C" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">READING-FIRST</text>
    <use href="#icon-b" x="636" y="278" width="168" height="168" />
    <text x="552" y="488" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">Page + fold = save this article</text>
    <text x="552" y="516" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="14">编辑、阅读和收藏的产品联想最直接。</text>
    <text x="552" y="552" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Article · Save · Read later</text>
    <rect x="552" y="576" width="116" height="28" rx="14" fill="#F4F0EA" />
    <text x="610" y="595" text-anchor="middle" fill="#6B5E4C" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">editorial tone</text>
  </g>

  <!-- Direction C -->
  <g>
    <circle cx="1002" cy="220" r="22" fill="#EAE9FA" />
    <text x="1002" y="228" text-anchor="middle" fill="#5C54A6" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">C</text>
    <text x="1040" y="218" fill="#0F172A" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700">Vault C</text>
    <text x="1040" y="244" fill="#665DD0" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SYSTEM MARK</text>
    <use href="#icon-c" x="1076" y="278" width="168" height="168" />
    <text x="992" y="488" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">C = doorway into the vault</text>
    <text x="992" y="516" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="14">知识库和本地归档的系统感更强。</text>
    <text x="992" y="552" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Vault · Archive · Knowledge system</text>
    <rect x="992" y="576" width="106" height="28" rx="14" fill="#EEEDFC" />
    <text x="1045" y="595" text-anchor="middle" fill="#5C54A6" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">system feel</text>
  </g>

  <!-- Toolbar-scale preview -->
  <g>
    <text x="80" y="704" fill="#0F172A" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">Toolbar scale check</text>
    <text x="80" y="730" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="14">缩小到浏览器工具栏尺寸后，三套图形仍保持不同的识别逻辑。</text>
    <rect x="80" y="752" width="1280" height="82" rx="20" fill="#DCE5F0" />
    <rect x="104" y="770" width="1232" height="46" rx="12" fill="#4A5565" />
    <circle cx="134" cy="793" r="8" fill="#94A3B8" />
    <path d="M166 793h62" stroke="#77859A" stroke-width="4" stroke-linecap="round" />
    <use href="#icon-a" x="956" y="777" width="32" height="32" />
    <use href="#icon-b" x="1004" y="777" width="32" height="32" />
    <use href="#icon-c" x="1052" y="777" width="32" height="32" />
    <text x="972" y="808" text-anchor="middle" fill="#475569" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">A</text>
    <text x="1020" y="808" text-anchor="middle" fill="#475569" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">B</text>
    <text x="1068" y="808" text-anchor="middle" fill="#475569" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">C</text>
    <text x="1288" y="798" text-anchor="end" fill="#C8D2E0" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">16px / high contrast / flat color</text>
  </g>
</svg>
